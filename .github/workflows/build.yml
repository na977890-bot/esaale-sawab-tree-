name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Clean and Recreate Project
        run: |
          rm -f pubspec.yaml
          cat > pubspec.yaml << 'EOF'
          name: esaale_sawab_tree
          description: Esaale Sawab Tree App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.5
            image_picker: ^1.1.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF
          flutter clean
          flutter create . --platforms=android --project-name esaale_sawab_tree --org com.esaale.tree --overwrite
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Esaale-Sawab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
