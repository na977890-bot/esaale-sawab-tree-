name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix project structure
        run: |
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart.bak; fi
          if [ -f pubspec.yaml ]; then cp pubspec.yaml /tmp/pubspec.bak; fi
          flutter create . --platforms=android --project-name esaale_sawab_tree --org com.esaale.tree --overwrite || flutter create .
          if [ -f /tmp/main.dart.bak ]; then cp /tmp/main.dart.bak lib/main.dart; fi
          flutter pub add image_picker
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Esaale-Sawab-APK
          path: build/app/outputs/flutter-apk/app-release.apk
